<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursorセットアップ完了！</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #fda085 100%);
      background-size: 300% 300%;
      animation: gradientShift 8s ease infinite;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      padding: 60px 48px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      max-width: 700px;
      width: 90%;
      animation: fadeInUp 0.9s ease both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .emoji {
      font-size: 80px;
      display: block;
      margin-bottom: 24px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .highlight {
      background: linear-gradient(90deg, #fff176, #ffcc02, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: rgba(255, 255, 255, 0.92);
      font-weight: 500;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      margin-bottom: 40px;
    }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      animation: fadeInUp 0.9s ease both;
    }

    .badge:nth-child(1) { background: rgba(255, 107, 157, 0.7); animation-delay: 0.3s; }
    .badge:nth-child(2) { background: rgba(102, 126, 234, 0.7); animation-delay: 0.5s; }
    .badge:nth-child(3) { background: rgba(67, 233, 123, 0.6); animation-delay: 0.7s; }

    /* 背景の装飾丸 */
    .circle {
      position: fixed;
      border-radius: 50%;
      opacity: 0.18;
      filter: blur(60px);
      pointer-events: none;
    }

    .circle-1 {
      width: 400px; height: 400px;
      background: #ff6b9d;
      top: -100px; left: -100px;
      animation: float 10s ease-in-out infinite;
    }

    .circle-2 {
      width: 300px; height: 300px;
      background: #4fc3f7;
      bottom: -80px; right: -80px;
      animation: float 13s ease-in-out infinite reverse;
    }

    .circle-3 {
      width: 200px; height: 200px;
      background: #fff176;
      top: 50%; left: 5%;
      animation: float 9s ease-in-out infinite 2s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      33%       { transform: translate(20px, -20px); }
      66%       { transform: translate(-15px, 15px); }
    }
  </style>
</head>
<body>
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
  <div class="circle circle-3"></div>

  <div class="container">
    <span class="emoji">🎉</span>
    <h1><span class="highlight">Cursorセットアップ完了！</span></h1>
    <p class="subtitle">AIと一緒にものづくりを始める準備ができました</p>
    <div class="badges">
      <span class="badge">✨ Cursor 導入済み</span>
      <span class="badge">🤖 AI アシスタント有効</span>
      <span class="badge">🚀 さあ、作ろう！</span>
    </div>
  </div>
</body>
</html>
